version: "2"
sql:
   - engine: "mysql"
     queries: "./internal/database/query"
     schema: "./internal/database/schema"
     gen:
        go:
           package: "repo"
           out: "./internal/database/sqlc"
           emit_json_tags: true
           emit_interface: true
           emit_pointers_for_null_types: true
           json_tags_case_style: camel
